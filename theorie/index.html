<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-itunes-app" content="app-id=6811613633">
<title>Theorie Trainer – download</title>
<meta name="description" content="Oefen voor je CBR auto theorie-examen met Theorie Trainer.">
<meta property="og:title" content="Theorie Trainer">
<meta property="og:description" content="Oefen voor je CBR auto theorie-examen.">
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --text:#1a1d21; --muted:#5b6470; --accent:#0a66ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#f1f3f5; --muted:#a3abb5; --accent:#4d8dff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  .card { background:var(--card); border-radius:20px; padding:32px 24px; max-width:380px; width:100%;
          text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 24px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
         font-weight:600; padding:14px 28px; border-radius:12px; font-size:17px; }
  .note { font-size:13px; margin-top:20px; margin-bottom:0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Theorie Trainer</h1>
    <p>Oefen voor je CBR auto theorie-examen, waar en wanneer je wilt.</p>
    <a class="btn" id="dl" href="https://apps.apple.com/nl/app/theorie-trainer/id6811613633">Download in de App Store</a>
    <p style="margin:12px 0 0"><a class="btn" style="background:#1a1d21" href="https://play.google.com/store/apps/details?id=nl.elgar.theorietrainer">Download op Google Play</a></p>
    <p class="note" id="note">Je wordt automatisch doorgestuurd…</p>
  </div>
<script>
  var APP_STORE_URL = "https://apps.apple.com/nl/app/theorie-trainer/id6811613633";
  var PLAY_URL = "https://play.google.com/store/apps/details?id=nl.elgar.theorietrainer";
  var ua = navigator.userAgent || "";
  var isApple = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var note = document.getElementById("note");
  if (isApple) {
    window.location.replace(APP_STORE_URL);
  } else if (/Android/i.test(ua)) {
    window.location.replace(PLAY_URL);
  } else {
    note.textContent = "Open deze pagina op je telefoon om de app te downloaden.";
  }
</script>
</body>
</html>
